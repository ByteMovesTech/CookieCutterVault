<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookie Cutter Vault - Login</title>
<style>
body { font-family: Arial; background: #f6f6f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.container { background: #fff; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
h1 { text-align: center; margin-bottom: 1.5rem; }
input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
button { width: 100%; padding: 10px; margin-top: 12px; background: #e67e22; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
button:hover { background: #cf6c13; }
#error { color: red; margin-top: 10px; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <h1 style="text-align:center; color:#e67e22;">🍪 Jaclyn's Cookie Cutter Vault 🍪</h1>
  <input id="email" type="email" placeholder="Email" required />
  <input id="password" type="password" placeholder="Password" required />
  <button id="loginBtn">Log In</button>
  <div id="error"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const errorDiv = document.getElementById("error");

// Persist login
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .then(() => console.log("Auth persistence set to LOCAL"))
  .catch(err => console.error(err));

// Redirect if already logged in (with small delay to prevent loop)
auth.onAuthStateChanged(user => {
  setTimeout(() => {
    if (user && user.uid) {
      window.location.href = "dashboard.html";
    }
  }, 100);
});

// Log in
loginBtn.addEventListener("click", () => {
  errorDiv.textContent = "";
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if (!email || !password) return;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => { window.location.href = "dashboard.html"; })
    .catch(err => { console.error(err); errorDiv.textContent = err.message; });
});
</script>

</body>
</html>
